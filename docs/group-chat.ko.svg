<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d" xml:lang="ko">
  <title id="t">Group chat</title>
  <desc id="d">① @부른 멤버에게만. ② + 각자 놓친 대화. ③ 답에 @b-codex. ④ b-codex에게 넘김. 답은 물어본 멤버에게 돌아감; 한도를 넘으면 버리지 않고 대기; 한도는 대화방마다 정함</desc>
  <style>
    text { font-family: "Noto Sans KR", "Noto Sans SC", "Apple SD Gothic Neo", "PingFang SC", "Segoe UI", "Malgun Gothic", "Microsoft YaHei", sans-serif; fill: #1F2328; }
    .h { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .l { font-size: 15px; fill: #57606A; }
    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .m { font-family: "Consolas", "Menlo", monospace; font-size: 11px; font-weight: 700; fill: #57606A; }
    .w { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .s { font-size: 12px; fill: #57606A; }
    .b { font-size: 13px; }
    .t { font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a-claude" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#C96442"/></marker>
    <marker id="a-codex" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker>
    <marker id="a-agent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7C3AED"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#1A7F37"/></marker>
  </defs>
  <rect x=".5" y=".5" width="879" height="359" rx="18" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="24" y="128" width="120" height="56" rx="12" fill="#F0E6DC" stroke="#D0D7DE"/>
  <text class="t" x="84" y="161" text-anchor="middle">나</text>
  <rect x="300" y="36" width="230" height="248" rx="14" fill="#F0FAF3" stroke="#6CC08B"/>
  <text class="t" x="415" y="64" text-anchor="middle">Reason Network Chat</text>
  <text class="s" x="415" y="100" text-anchor="middle" style="font-style:italic">“@a-claude 이 PR 확인해 줘”</text>
  <rect x="316" y="196" width="198" height="20" rx="10" fill="#FFFFFF" stroke="#6CC08B"/><text class="s" x="415" y="210" text-anchor="middle" style="font-size:11px">답은 물어본 멤버에게 돌아감</text>
  <rect x="316" y="222" width="198" height="20" rx="10" fill="#FFFFFF" stroke="#6CC08B"/><text class="s" x="415" y="236" text-anchor="middle" style="font-size:11px">한도를 넘으면 버리지 않고 대기</text>
  <rect x="316" y="248" width="198" height="20" rx="10" fill="#FFFFFF" stroke="#6CC08B"/><text class="s" x="415" y="262" text-anchor="middle" style="font-size:11px">한도는 대화방마다 정함</text>
  <rect x="700" y="56" width="156" height="48" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="700" y="56" width="8" height="48" rx="4" fill="#C96442"/><text class="m" x="722" y="85" style="font-size:13px;fill:#1F2328">a-claude</text>
  <rect x="700" y="136" width="156" height="48" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="700" y="136" width="8" height="48" rx="4" fill="#2563EB"/><text class="m" x="722" y="165" style="font-size:13px;fill:#1F2328">b-codex</text>
  <rect x="700" y="216" width="156" height="48" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="700" y="216" width="8" height="48" rx="4" fill="#2563EB"/><text class="m" x="722" y="245" style="font-size:13px;fill:#1F2328">c-codex</text>
  <text class="s" x="778" y="282" text-anchor="middle">호명 없음 · 전달 안 함</text>
  <path d="M534 70H694" fill="none" stroke="#1A7F37" stroke-width="2" marker-end="url(#a-green)"/>
  <path d="M148 156H296" stroke="#C96442" stroke-width="2.5" marker-end="url(#a-claude)"/><path d="M700 94C640 94 600 116 538 116" fill="none" stroke="#C96442" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-claude)"/><path d="M534 160H694" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#a-agent)"/>
  <circle cx="222" cy="156" r="10" fill="#C96442"/><text class="w" x="222" y="160" text-anchor="middle">1</text>
  <circle cx="620" cy="70" r="10" fill="#1A7F37"/><text class="w" x="620" y="74" text-anchor="middle">2</text>
  <circle cx="620" cy="105" r="10" fill="#C96442"/><text class="w" x="620" y="109" text-anchor="middle">3</text>
  <circle cx="620" cy="160" r="10" fill="#7C3AED"/><text class="w" x="620" y="164" text-anchor="middle">4</text>
  <circle cx="60" cy="312" r="10" fill="#C96442"/><text class="w" x="60" y="316" text-anchor="middle">1</text>
  <text class="b" x="78" y="317">@부른 멤버에게만</text>
  <circle cx="460" cy="312" r="10" fill="#1A7F37"/><text class="w" x="460" y="316" text-anchor="middle">2</text>
  <text class="b" x="478" y="317">+ 각자 놓친 대화</text>
  <circle cx="60" cy="338" r="10" fill="#C96442"/><text class="w" x="60" y="342" text-anchor="middle">3</text>
  <text class="b" x="78" y="343">답에 @b-codex</text>
  <circle cx="460" cy="338" r="10" fill="#7C3AED"/><text class="w" x="460" y="342" text-anchor="middle">4</text>
  <text class="b" x="478" y="343">b-codex에게 넘김</text>
