<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="t d" xml:lang="en">
  <title id="t">Reason Network Chat — Reason Network daemon</title>
  <desc id="d">Agent sessions → Reason Network daemon → Reason Network Chat. read: SQLite read-only + who --json. send: reason network send. start: reason network serve or a terminal window.</desc>
