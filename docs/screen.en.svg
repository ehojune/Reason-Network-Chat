<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d" xml:lang="en">
  <title id="t">Reason Network Chat</title>
  <desc id="d">Example screen with sample data: sessions on the left, chat bubbles on the right, send box at the bottom.</desc>
  <style>
