<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="reason-chat-token" content="{{TOKEN}}">
<meta name="reason-chat-boot" content="{{BOOT}}">
<title>Reason Network Chat</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e4e3df; --text: #1f1f1d; --muted: #6f6e69;
  --accent: #c96442; --me: #f0e6dc; --bubble: #ffffff; --hover: #efeee9; --sel: #e8e2d8;
  --busy: #d97706; --idle: #16a34a; --off: #a3a3a3; --err: #b91c1c;
  --claude: #c96442; --codex: #2563eb; --agent: #7c3aed; --cli: #0f766e; --other: #6b7280;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d1d1b; --panel: #262624; --line: #3a3936; --text: #ecebe6; --muted: #a09f99;
  --me: #3b302a; --bubble: #2e2e2b; --hover: #31312e; --sel: #3a3631;
  --claude: #e08a68; --codex: #6ea0ff; --agent: #a78bfa; --cli: #2dd4bf; --err: #f87171;
} }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
/* Segoe UI before Malgun Gothic: Malgun Gothic draws "\" as a won sign, which wrecks Windows paths. */
body { background: var(--bg); color: var(--text); display: flex; overflow: hidden;
  font: 14px/1.5 "Pretendard", "Segoe UI", "Malgun Gothic", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
#side { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; }
/* Drag (or arrow keys) to resize the list; double-click to reset. A wide invisible grip over the border line. */
#split { flex: none; width: 8px; margin: 0 -4px; z-index: 2; cursor: col-resize; touch-action: none; position: relative; }
#split::after { content: ""; position: absolute; inset: 0 3px; background: transparent; transition: background .15s; }
#split:hover::after, #split:focus-visible::after, #split.drag::after { background: var(--accent); }
#split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
#brand { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 4px; }
#brand h1 { font-size: 15px; margin: 0; }
#langs button { background: none; color: var(--muted); border: none; padding: 0 3px; font-size: 11px; font-weight: 600; cursor: pointer; }
#langs button.on { color: var(--accent); }
#team { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
#acts { display: flex; gap: 6px; padding: 0 10px 10px; border-bottom: 1px solid var(--line); }
.act { flex: 1; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; cursor: pointer; }
.act:hover { background: var(--hover); }
#list { overflow-y: auto; flex: 1; padding: 6px; }
.grp { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 8px 4px; }
.ses { padding: 7px 8px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto;
  gap: 2px 8px; align-items: center; }
.ses:hover { background: var(--hover); }
.ses.sel { background: var(--sel); }
.ses.gone { opacity: .55; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.dot.busy { background: var(--busy); } .dot.idle { background: var(--idle); }
.nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnt { color: var(--muted); font-size: 11px; }
.sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 4px; color: #fff;
  background: var(--other); margin-right: 4px; vertical-align: 1px; }
.tag.claude-code { background: var(--claude); } .tag.codex { background: var(--codex); }
.tag.agent { background: var(--agent); } .tag.cli { background: var(--cli); }
.tag.wk { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.hash { color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1; text-align: center; }
.mem { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.mem label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; color: var(--text);
  font-size: 13px; cursor: pointer; }
.mem label:hover { background: var(--hover); }
.mem label.gone { opacity: .55; }
.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
.tag.grp { background: none; color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }
.relay { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0; }
#paused { color: var(--err); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#head { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex;
  justify-content: space-between; align-items: center; gap: 8px; }
#head b { font-size: 15px; }
#headR { display: flex; align-items: center; gap: 10px; min-width: 0; }
#status { color: var(--muted); font-size: 12px; }
#status.err { color: var(--err); }
#stop, #editRoom, #wakeHead { font: inherit; font-size: 12px; color: var(--text); background: none; border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 8px; cursor: pointer; }
#stop, .danger { color: var(--err) !important; }
#members { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
#tl { flex: 1; overflow-y: auto; padding: 16px 18px; }
.day { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 8px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; margin: 10px 0; }
.msg.me { align-items: flex-end; }
.meta { font-size: 12px; color: var(--muted); margin: 0 4px 3px; }
.meta .who { font-weight: 600; color: var(--text); cursor: pointer; }
.meta .who:hover { text-decoration: underline; }
.bub { background: var(--bubble); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px;
  max-width: min(720px, 85%); white-space: pre-wrap; word-break: break-word; }
.msg.me .bub { background: var(--me); }
.msg.me .tag { background: var(--accent); }
.quote { border-left: 3px solid var(--line); color: var(--muted); font-size: 12px; padding: 0 0 0 8px; margin-bottom: 6px;
  max-height: 3em; overflow: hidden; }
.foot { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
.empty { color: var(--muted); text-align: center; margin-top: 30vh; }
#comp { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
#nowake { font-size: 12px; color: var(--muted); }
#offToggle { font: inherit; font-size: 11.5px; color: var(--muted); background: none; border: none; padding: 8px 8px 4px;
  cursor: pointer; text-align: left; }
#offToggle:hover { color: var(--text); text-decoration: underline; }
.ses:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.star { color: var(--accent); margin-right: 4px; }
#ctx { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); padding: 4px; min-width: 150px; }
#ctx button { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text);
  background: none; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
#ctx button:hover, #ctx button:focus-visible { background: var(--hover); outline: none; }
#nowake #wakeNote { font-style: italic; }
#nowake button { font: inherit; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline; }
#row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
select, textarea, input, #btn { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
select { padding: 4px 6px; max-width: 320px; }
#inrow { display: flex; gap: 8px; }
textarea { flex: 1; resize: none; padding: 8px 10px; min-height: 42px; max-height: 160px; }
#btn, .go { background: var(--accent); color: #fff; border: none; padding: 0 16px; cursor: pointer; font-weight: 600; }
#btn:disabled, .go:disabled { opacity: .5; cursor: default; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
  padding: 18px 20px; width: min(560px, 94vw); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { font-size: 16px; margin: 0 0 4px; }
.fld { display: flex; flex-direction: column; gap: 4px; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.fld input, .fld select { font-size: 14px; padding: 6px 8px; max-width: none; }
.fld select:disabled, .fld input:disabled { opacity: .55; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--me); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12px; color: var(--muted); min-height: 1.5em; margin: 12px 0 0; white-space: pre-wrap; }
.hint.err { color: var(--err); }
.dbtn { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.dbtn button { font: inherit; font-size: 13px; border-radius: 8px; padding: 6px 14px; }
.plain { color: var(--text); background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
@media (max-width: 640px) { #side { width: 170px !important; } #split { display: none; } .sub { display: none; }
  .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside id="side">
  <div id="brand"><h1>Reason Network Chat</h1><span id="langs"></span></div>
  <div id="team"></div>
  <div id="acts"><button type="button" class="act" id="newSes" data-t="newSession"></button>
    <button type="button" class="act" id="newRoom" data-t="newRoom"></button></div>
  <div id="list"></div>
</aside>
<div id="split" role="separator" aria-orientation="vertical" tabindex="0" aria-valuemin="180"></div>
<main>
  <div id="head"><span><b id="title"></b><span id="members"></span></span><span id="headR">
    <button type="button" id="wakeHead" hidden data-t="wake"></button>
    <button type="button" id="editRoom" hidden data-t="editRoom"></button>
    <button type="button" id="stop" hidden data-t="stop"></button><span id="status"></span></span></div>
  <div id="tl"></div>
  <form id="comp">
    <div id="paused"></div>
    <div id="nowake" hidden><span id="nowakeText"></span> <button type="button" id="wakeBtn" data-t="wake"></button>
      <button type="button" id="toWorker" data-t="toWorker"></button> <span id="wakeNote"></span></div>
    <div id="row">
      <span data-t="to"></span><select id="to"></select>
      <label id="fyiLabel"><input type="checkbox" id="fyi"> <span data-t="fyi"></span></label>
      <label id="wakeAfterLabel" hidden><input type="checkbox" id="wakeAfter"> <span data-t="wakeAfter"></span></label>
      <span id="sendmsg"></span>
    </div>
    <div id="inrow">
      <textarea id="body"></textarea>
      <button id="btn" type="submit" data-t="send"></button>
    </div>
  </form>
</main>
<div id="ctx" role="menu" hidden><button type="button" role="menuitem" id="ctxFav"></button></div>
<dialog id="dlg">
  <form id="lf">
    <h2 data-t="newSessionTitle"></h2>
    <label class="fld"><span data-t="folder"></span>
      <input id="lfFolder" list="folders" required spellcheck="false" autocomplete="off"></label>
    <datalist id="folders"></datalist>
    <div class="fld"><span data-t="agent"></span><div class="chips" id="lfAgents"></div></div>
    <div class="fld"><span data-t="runAs"></span><div class="chips" id="lfModes"></div></div>
    <div class="two">
      <label class="fld"><span data-t="model"></span><select id="lfModel"></select></label>
      <label class="fld"><span data-t="effort"></span><select id="lfEffort"></select></label>
    </div>
    <label class="fld" id="lfNameRow"><span data-t="name"></span>
      <input id="lfName" spellcheck="false" autocomplete="off" maxlength="48"></label>
    <p class="hint" id="lfHint"></p>
    <div class="dbtn"><button type="button" class="plain" id="lfCancel" data-t="cancel"></button>
      <button type="submit" class="go" id="lfGo" data-t="start"></button></div>
  </form>
</dialog>
<dialog id="rdlg">
  <form id="rf">
    <h2 id="rfTitle"></h2>
    <label class="fld"><span data-t="roomName"></span>
      <input id="rfName" required maxlength="60" autocomplete="off"></label>
    <div class="fld"><span data-t="roomMembers"></span><div class="mem" id="rfMembers"></div></div>
    <label class="fld chk"><input type="checkbox" id="rfGroup"> <span data-t="groupChat"></span></label>
    <p class="hint" id="rfHint"></p>
    <div class="dbtn"><button type="button" class="plain danger" id="rfDelete" data-t="deleteRoom"></button>
      <span style="flex:1"></span>
      <button type="button" class="plain" id="rfCancel" data-t="cancel"></button>
      <button type="submit" class="go" id="rfGo" data-t="save"></button></div>
  </form>
</dialog>

let lang = new URLSearchParams(location.search).get("lang") || store.get("reason-chat-lang") || guess();
if (!T[lang]) lang = "en";
const t = k => T[lang][k];
const TOKEN = document.querySelector('meta[name="reason-chat-token"]').content;

// Reload to pick up a restarted or newer server, at most once a minute so a broken setup cannot loop.
function reloadOnce() {
  let last = 0;
  try { last = +sessionStorage.getItem("rnc-reloaded") || 0; } catch {}
  if (Date.now() - last < 60000) return false;
  try { sessionStorage.setItem("rnc-reloaded", String(Date.now())); } catch {}
  location.reload();
  return true;
}

const fmtD = ms => new Date(ms).toLocaleDateString(LOCALE[lang], {year: "numeric", month: "long", day: "numeric", weekday: "short"});
const st = s => t(s) || s;

async function post(url, obj) {
  const r = await fetch(url, {method: "POST", body: JSON.stringify(obj),
    headers: {"Content-Type": "application/json", "X-Reason-Chat-Token": TOKEN}});
  const j = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
  // The server restarted (new token) whatever its version: a fresh page from it carries the right token.
  if (r.status === 403 && /token/.test(j.error || "")) reloadOnce();
  if (!r.ok || j.error || j.ok === false) {
    throw Object.assign(new Error(j.error || j.err || j.out || `HTTP ${r.status}`), {status: r.status});
  }
  return j;
}

// Live session type wins: replies from `serve` workers are recorded with sender_agent "cli".
function agentOf(addr, recorded) {
  if (addr === S.me) return t("me");
  const s = S.sessions.find(x => x.address === addr);
  if (s && s.agent && s.agent !== "?") return s.agent;
  return recorded || S.messages.find(x => x.sender === addr && x.sender_agent)?.sender_agent || "?";
}
const person = () => (S && S.me ? S.me.split("/")[0] : "");
// The selection is "" (everything), a session address, or "room:<id>".
const roomOf = key => key && key.startsWith("room:") && S ? (S.rooms || []).find(r => r.id === key.slice(5)) : null;

const shown = m => { const r = roomOf(sel); return r ? inRoom(m, r) : !sel || m.sender === sel || m.recipient === sel; };
const launchedHere = addr => S.launched.some(w => `${person()}/${w.name}` === addr);
// How a message reaches a session, from Reason's tier and the live status. Measured on this network: idle Claude
// Code sessions (push) read at once; Codex app sessions do not wake on a message (push idle: next turn; pull: only

function reach(s) {

  if (s.worker) return s.status === "busy" ? "workerBusy" : "now";
  if (s.agent === "cli") return "cli";
  if (s.status === "busy") return "afterTurn";
  if (s.tier === "pull") return "pull";

}

const NOW = ["now", "workerBusy", "pushed", "afterTurn"], LATER = ["pull", "nextTurn", "cli"];

// Preferences live on the server (the Browser pane can lose localStorage); localStorage only when saving fails.
function pref(key) {

  if (local !== null) { try { return JSON.parse(local); } catch {} }
  return S && S.prefs ? S.prefs[key] : undefined;
}
async function setPref(key, value) {
  try {
    S.prefs = (await post("/api/prefs", {key, value})).prefs;
    store.del("rnc-pref-" + key);
  } catch (err) {
    // A rejected value (4xx) is not kept anywhere; only a failed save falls back to this browser.
    if (err.status >= 400 && err.status < 500) say(t("failed") + err.message, true);
    else { store.set("rnc-pref-" + key, JSON.stringify(value)); say(t("prefLocal") + err.message, true); }

function renderSide() {
  const count = a => S.messages.filter(m => m.sender === a || m.recipient === a).length;
  const group = s => NOW.includes(reach(s)) ? 0 : LATER.includes(reach(s)) ? 1 : reach(s) === "offline" ? 2 : 3;
  const hide = pref("hideOffline") !== false;
  const all = [...S.sessions].sort((a, b) => group(a) - group(b) || (b.status === "busy") - (a.status === "busy")
    || (count(b.address) - count(a.address)) || a.name.localeCompare(b.name));
  const fav = favs();
  const away = all.filter(s => group(s) >= 2 && s.address !== sel && !fav.includes(s.address));  // selected and favorites always show
  const ss = (hide ? all.filter(s => !away.includes(s)) : all).filter(s => !fav.includes(s.address));
  const star = key => fav.includes(key) ? `<span class="star">★</span>` : "";
  const roomRow = r => {
    const key = `room:${r.id}`, c = S.messages.filter(m => inRoom(m, r)).length;
    return `<div class="ses ${sel === key ? "sel" : ""}" tabindex="0" data-a="${esc(key)}" title="${esc(r.members.join(", "))}">

    h += `<div class="msg ${me ? "me" : ""}">
      <div class="meta"><span class="tag ${esc(ag)}">${esc(ag)}</span><span class="who" data-a="${esc(m.sender)}">${esc(short(m.sender))}</span>
        → ${m.to.map(a => `<span class="who" data-a="${esc(a)}">${esc(short(a))}</span>`).join(", ")} · ${fmtT(m.sent_at)}</div>
      <div class="bub">${q ? `<div class="quote">↪ ${esc(short(qr ? qr.speaker : q.sender))}: ${esc((qr ? qr.core : q.body).slice(0, 160))}</div>` : ""}${esc(m.body)}</div>
      <div class="foot">${esc(flags)}</div></div>`;
  }
  tl.innerHTML = h;
  if (atBottom || tl.dataset.first !== "0") { tl.scrollTop = tl.scrollHeight; tl.dataset.first = "0"; }
}

function render(force) {
  if (S) applySide();
  const room = roomOf(sel);
  $("#title").textContent = room ? `# ${room.name}` : sel && !sel.startsWith("room:") ? short(sel) : t("all");
  $("#members").textContent = room ? (room.group ? `${t("grp")} · ` : "") + room.members.map(short).join(", ") : "";
  const pz = room && S && S.paused[room.id], nz = room && S && S.notices[room.id];
  $("#paused").textContent = [pz ? t(pz === "budget" ? "pausedBudget" : "pausedHops") : "", nz ? t("handoffFailed") + nz : ""]
    .filter(Boolean).join(" ");
  $("#body").placeholder = room && room.group ? t("groupPh") : t("ph");
  $("#fyiLabel").hidden = !!(room && room.group);  // a group message always wakes its targets
  $("#editRoom").hidden = !room;
  if (!S) return;
  if (sel && sel.startsWith("room:") && !room) sel = null;  // deleted elsewhere
  if (pendingAddr && S.sessions.some(s => s.address === pendingAddr && s.live)) {
    sel = pendingAddr; pendingAddr = null; $("#tl").dataset.first = "1"; force = true;
  }
  $("#stop").hidden = !(sel && launchedHere(sel));
  const ss = sel && S.sessions.find(x => x.address === sel);
  $("#wakeHead").hidden = !(ss && ss.resumable && sleepy(ss) && unreadTo(sel));
  $("#wakeHead").disabled = !!(ss && waking(sel));
  $("#wakeHead").textContent = t(ss && waking(sel) ? "waking" : "wake");
  const sig = JSON.stringify([S.sessions, S.launched, S.rooms, S.paused, S.notices, S.prefs, S.wakes, Object.keys(S.relays).length,
    S.messages.map(m => [m.id, m.read_at, m.held]), sel, lang]);
  if (!force && sig === lastSig) return;
  lastSig = sig;
  renderSide(); renderTo(); renderTl(); renderNoWake();
}

const unreadTo = a => S.messages.some(m => m.recipient === a && !m.read_at);
const waking = a => (S.wakes[a] || {}).status === "running";
function renderNoWake() {
  const s = S.sessions.find(x => x.address === $("#to").value);
  $("#nowake").hidden = !sleepy(s);
  $("#wakeAfterLabel").hidden = !(sleepy(s) && s.resumable);
  if (!sleepy(s)) return;
  $("#nowakeText").textContent = t({offline: "nwOffline", pull: "nwPull", nextTurn: "nowake"}[reach(s)]);
  $("#wakeBtn").hidden = !s.resumable;
  $("#wakeBtn").disabled = waking(s.address) || !unreadTo(s.address);
  $("#wakeBtn").title = unreadTo(s.address) ? "" : t("wakeNoUnread");
  $("#wakeBtn").textContent = t(waking(s.address) ? "waking" : "wake");
  const w = S.wakes[s.address];
  $("#wakeNote").textContent = !s.resumable ? `(${t("wakeNo")})` : w && w.status === "failed" ? t("wakeFailed") + w.error : "";
  $("#toWorker").hidden = !(s && s.cwd && ["codex", "claude-code"].includes(s.agent));
}

// Wake: one headless turn in the session's own Codex conversation (wake.py); the server picks thread and prompt.
async function wake(address, asked) {
  if (!asked && !confirm(t("wakeAsk").replace("{name}", short(address)))) return false;
  try {
    await post("/api/wake", {address});
    say(t("waking") + " " + short(address)); poll(); return true;
  } catch (err) { say(t("wakeFailed") + err.message, true); return false; }
}
$("#wakeBtn").addEventListener("click", () => wake($("#to").value));
$("#wakeHead").addEventListener("click", () => wake(sel));

function say(msg, err) { $("#status").className = err ? "err" : ""; $("#status").textContent = msg; }

let polling = false, lost = false;
async function poll() {
  if (polling) return;  // a slow response must not land after a newer one
  polling = true;
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    // Back after the server was unreachable. With a boot id the comparison below decides (same id: a network blip,
    // keep the page and its draft); a server too old to have one may have restarted with a new token: reload.
    if (lost) { lost = false; if (!j.boot && reloadOnce()) return; }
    // Any other server start (it has a boot id: restarted, upgraded or rolled back) means a new token, and maybe
    // other code: a fresh page from it fits. Only a server too old to have a boot id needs a restart instead.
    if ((j.boot && j.boot !== BOOT) || j.api > API) { if (reloadOnce()) return; }
    if (j.api !== API) return say(t(j.api > API ? "reloadPage" : "restart").replace("{p}", API).replace("{s}", j.api ?? 1), true);
    if (j.boot !== BOOT) return say(t("reloadPage"), true);
    S = {sessions: [], messages: [], launched: [], rooms: [], relays: {}, paused: {}, notices: {}, prefs: {}, wakes: {}, ...j};
    render();
    say(j.whoError ? t("whoErr") + j.whoError : `${t("updated")} ${fmtT(j.now)}`, !!j.whoError);
  } catch (e) {
    if (e instanceof TypeError) lost = true;  // fetch itself failed: the server is down or restarting
    say(t("connErr") + e.message, true);
  } finally { polling = false; }
}

function pick(a) { sel = a || null; $("#tl").dataset.first = "1"; render(true); }
$("#list").addEventListener("click", e => {
  if (e.target.closest("#offToggle")) return setPref("hideOffline", !(pref("hideOffline") !== false));
  const x = e.target.closest(".ses"); if (x) pick(x.dataset.a);
});
$("#tl").addEventListener("click", e => { const x = e.target.closest(".who"); if (x) pick(x.dataset.a); });
$("#list").addEventListener("keydown", e => {
  const x = e.target.closest(".ses"); if (!x) return;
  if (e.key === "Enter") pick(x.dataset.a);
  if (e.key === "ContextMenu" || (e.shiftKey && e.key === "F10")) { e.preventDefault(); openCtx(x, null); }
});

// Right-click (or the menu key on a focused row): pin a session or room to the top as a favorite.
let ctxKey = null;
function closeCtx() { $("#ctx").hidden = true; ctxKey = null; }
function openCtx(row, pointer) {
  if (!row.dataset.a) return;  // "All messages" has no menu
  ctxKey = row.dataset.a;
  $("#ctxFav").textContent = t(favs().includes(ctxKey) ? "unfav" : "fav");
  const m = $("#ctx"), r = row.getBoundingClientRect();
  m.hidden = false;
  const x = pointer ? pointer.clientX : r.left + 24, y = pointer ? pointer.clientY : r.bottom;  // keyboard: below the row
  m.style.left = Math.max(4, Math.min(x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(4, Math.min(y, innerHeight - m.offsetHeight - 8)) + "px";
  $("#ctxFav").focus();
}
$("#list").addEventListener("contextmenu", e => {
  const x = e.target.closest(".ses"); if (!x || !x.dataset.a) return;
  e.preventDefault();
  openCtx(x, e.clientX || e.clientY ? e : null);
});
$("#ctxFav").addEventListener("click", async () => {
  const key = ctxKey;
  closeCtx();
  if (!key) return;
  // Drop favorites whose room or session is gone, so they neither linger in the setting nor use up the cap.
  const f = favs().filter(k => roomOf(k) || S.sessions.some(s => s.address === k));
  if (!f.includes(key) && f.length >= 100) return say(t("favFull"), true);  // the server keeps at most 100
  await setPref("favorites", f.includes(key) ? f.filter(k => k !== key) : [...f, key]);
  [...$("#list").querySelectorAll(".ses")].find(r => r.dataset.a === key)?.focus();  // back to the row (focus-visible: keyboard only)
});
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) closeCtx(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || $("#ctx").hidden) return;
  const k = ctxKey; closeCtx();
  [...$("#list").querySelectorAll(".ses")].find(r => r.dataset.a === k)?.focus();  // back to the row
});
$("#list").addEventListener("scroll", closeCtx);
$("#langs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l; store.set("reason-chat-lang", lang); applyLang(); render(true);
});

$("#comp").addEventListener("submit", async e => {
  e.preventDefault();
  const to = $("#to").value, body = $("#body").value.trim();
  if (!to || !body) return;
  const room = roomOf(to), target = S.sessions.find(x => x.address === to);
  const off = room ? room.members.filter(a => ["offline", "gone"].includes(reach(S.sessions.find(x => x.address === a) || {live: false})))
    : target && ["offline", "gone"].includes(reach(target)) ? [to] : [];
  if (off.length && !confirm(room ? t("roomOffline").replace("{names}", off.map(short).join(", "))
    : t("sendOffline").replace("{name}", short(to)))) return;
  $("#btn").disabled = true; $("#sendmsg").textContent = t("sending");
  try {
    if (to.startsWith("room:")) {
      const j = await post("/api/rooms/send", {id: to.slice(5), body, fyi: !$("#fyiLabel").hidden && $("#fyi").checked});
      const bad = j.results.filter(r => !r.ok);
      $("#body").value = "";
      $("#sendmsg").textContent = `${t("sentTo")} ${j.sent}${t("of")}${j.results.length}` +
        (bad.length ? ` · ${t("failed")}${bad.map(r => `${short(r.to)}: ${r.err}`).join("; ")}` : "");
      $("#tl").dataset.first = "1"; poll(); return;
    }
    const wakeToo = !$("#wakeAfterLabel").hidden && $("#wakeAfter").checked;
    if (wakeToo && !confirm(t("wakeAsk").replace("{name}", short(to)))) return;
    await post("/api/send", {to, body, fyi: $("#fyi").checked});
    $("#body").value = ""; $("#sendmsg").textContent = `${t("sent")} ${short(to)}`;
    if (wakeToo) await wake(to, true);
    $("#tl").dataset.first = "1"; poll();
  } catch (err) {
    $("#sendmsg").textContent = t("failed") + err.message;
  } finally { $("#btn").disabled = false; }
});
$("#to").addEventListener("change", renderNoWake);
$("#toWorker").addEventListener("click", () => {
  const s = S.sessions.find(x => x.address === $("#to").value);
  if (s) openLaunch({folder: s.cwd || "", agent: s.agent === "claude-code" ? "claude" : "codex"});
});
$("#body").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#comp").requestSubmit(); }
});

$("#stop").addEventListener("click", async () => {
  const name = short(sel);
  if (!confirm(t("stopAsk") + name)) return;
  try { await post("/api/stop", {name}); say(t("stopped") + name); poll(); }
  catch (err) { say(t("failed") + err.message, true); }
});

// ---- new session: folder → agent → run as → model → effort, each list from the agent's own catalog ----
let CAT = null, LF = {agent: null, mode: "worker"}, nameEdited = false;
const fam = id => CAT && CAT.families.find(f => f.id === id);
function hint(msg, err) { $("#lfHint").className = "hint" + (err ? " err" : ""); $("#lfHint").textContent = msg || ""; }

async function openLaunch(prefill) {
  $("#dlg").showModal();
  hint(t("loadingCat"));
  try {
    const r = await fetch("/api/catalog", {cache: "no-store"});
    CAT = await r.json();
  } catch (e) { hint(t("connErr") + e.message, true); return; }
  $("#folders").innerHTML = CAT.folders.map(f => `<option value="${esc(f)}"></option>`).join("");
  if (prefill && prefill.agent) {
    $("#lfFolder").value = prefill.folder; LF.agent = prefill.agent; LF.mode = "worker"; nameEdited = false;
  }
  if (!fam(LF.agent)?.installed) LF.agent = (CAT.families.find(f => f.installed) || {}).id || null;
  renderLaunch();
}

function renderLaunch() {
  const f = fam(LF.agent);
  $("#lfAgents").innerHTML = CAT.families.map(x => `<button type="button" class="chip ${x.id === LF.agent ? "on" : ""}"
    data-agent="${esc(x.id)}" ${x.installed ? "" : "disabled"} title="${esc(x.installed ? "" : t("notInstalled"))}">${esc(x.label)}</button>`).join("");
  $("#lfGo").disabled = !f;
  if (!f) { $("#lfModes").innerHTML = ""; hint(t("noAgent"), true); return; }
  if (!f.modes[LF.mode].ok) LF.mode = ["worker", "window"].find(m => f.modes[m].ok) || LF.mode;
  $("#lfModes").innerHTML = ["worker", "window"].map(m => `<button type="button" class="chip ${m === LF.mode ? "on" : ""}"
    data-mode="${m}" ${f.modes[m].ok ? "" : "disabled"} title="${esc(f.modes[m].why || "")}">${t(m)}</button>`).join("");
  $("#lfGo").disabled = !f.modes[LF.mode].ok;
  renderModels();
}

function renderModels() {
  const f = fam(LF.agent), m = f.modes[LF.mode], keep = $("#lfModel").value;
  const def = f.defaultModel ? `${t("default")} (${f.defaultModel})` : t("default");
  $("#lfModel").innerHTML = `<option value="">${esc(def)}</option>` +
    f.models.map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");
  if (m.models && f.models.some(x => x.id === keep)) $("#lfModel").value = keep;
  $("#lfModel").disabled = !m.models;
  $("#lfNameRow").hidden = LF.mode !== "worker";
  renderEfforts();
  autoName();
  hint(!m.ok ? m.why : !m.models ? m.modelsWhy : f.note || t(LF.mode + "Hint"), !m.ok);
}

function renderEfforts() {
  const f = fam(LF.agent), m = f.modes[LF.mode], id = $("#lfModel").value, keep = $("#lfEffort").value;
  // Same rule as launcher.efforts_for: the chosen or default model's levels, else those every model has.
  const model = f.models.find(x => x.id === (id || f.defaultModel));
  const efforts = model ? model.efforts : f.efforts.filter(e => f.models.every(x => x.efforts.includes(e)));
  const d = id ? model.defaultEffort : f.defaultEffort || model?.defaultEffort;
  $("#lfEffort").innerHTML = `<option value="">${esc(d ? `${t("default")} (${d})` : t("default"))}</option>` +
    efforts.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join("");
  if (efforts.includes(keep)) $("#lfEffort").value = keep;
  // agy model ids carry the effort, so its effort needs a model.
  $("#lfEffort").disabled = !m.models || !efforts.length || (LF.agent === "antigravity" && !id);
}

function autoName() {
  if (nameEdited || !S) return;
  const base = ($("#lfFolder").value.split(/[\\/]/).filter(Boolean).pop() || "agent").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 36) || "agent";
  const taken = new Set(S.sessions.filter(s => s.live).map(s => s.name));
  let name = `${base}-${LF.agent}`, i = 2;
  while (taken.has(name)) name = `${base}-${LF.agent}-${i++}`;
  $("#lfName").value = name;
}

$("#newSes").addEventListener("click", () => openLaunch());
$("#lfCancel").addEventListener("click", () => $("#dlg").close());
$("#lfAgents").addEventListener("click", e => {
  const b = e.target.closest("button[data-agent]"); if (!b || b.disabled) return;
  LF.agent = b.dataset.agent; $("#lfModel").value = ""; renderLaunch();
});
$("#lfModes").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]"); if (!b || b.disabled) return;
  LF.mode = b.dataset.mode; renderLaunch();
});
$("#lfModel").addEventListener("change", renderEfforts);
$("#lfFolder").addEventListener("input", autoName);
$("#lfName").addEventListener("input", () => { nameEdited = !!$("#lfName").value; });

$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  const req = {folder: $("#lfFolder").value.trim(), agent: LF.agent, mode: LF.mode,
    model: $("#lfModel").disabled ? "" : $("#lfModel").value,
    effort: $("#lfEffort").disabled ? "" : $("#lfEffort").value,
    name: LF.mode === "worker" ? $("#lfName").value.trim() : ""};
  $("#lfGo").disabled = true; hint(t("starting"));
  try {
    const j = await post("/api/launch", req);
    $("#dlg").close(); nameEdited = false;
    if (j.mode === "worker") { pendingAddr = `${person()}/${j.name}`; say(t("startedWorker") + j.name); }
    else say(t("openedWindow"));
    poll();
  } catch (err) { hint(t("failed") + err.message, true); }
  finally { $("#lfGo").disabled = false; }
});

// ---- rooms: a saved set of sessions; this page filters to their traffic and sends to all of them ----
let editing = null;
function rhint(msg, err) { $("#rfHint").className = "hint" + (err ? " err" : ""); $("#rfHint").textContent = msg || ""; }
function openRoom(room) {
  if (!S) return;
  editing = room || null;
  $("#rfTitle").textContent = t(room ? "editRoom" : "newRoomTitle");
  $("#rfName").value = room ? room.name : "";
  $("#rfDelete").hidden = !room;
  $("#rfGroup").checked = !!(room && room.group);
  const chosen = new Set(room ? room.members : sel && !sel.startsWith("room:") ? [sel] : []);
  const up = s => s.live && s.status !== "offline";
  // Saved members whose traffic fell out of the message window are not in S.sessions; list them anyway,
  // or saving (even a rename) would drop them.
  const extra = [...chosen].filter(a => !S.sessions.some(s => s.address === a))
    .map(a => ({address: a, name: short(a), agent: "?", live: false, status: "gone"}));
  const ss = S.sessions.filter(s => s.address !== S.me).concat(extra)
    .sort((a, b) => (chosen.has(b.address) - chosen.has(a.address)) || (up(b) - up(a)) || a.name.localeCompare(b.name));
  $("#rfMembers").innerHTML = ss.map(s => `<label class="${up(s) ? "" : "gone"}"><input type="checkbox" value="${esc(s.address)}"
    ${chosen.has(s.address) ? "checked" : ""}><span class="tag ${esc(s.agent)}">${esc(s.agent)}</span>${esc(s.name)}</label>`).join("");
  rhint(t($("#rfGroup").checked ? "groupHint" : "roomHint"));
  $("#rdlg").showModal();
}
$("#newRoom").addEventListener("click", () => openRoom(null));
$("#rfGroup").addEventListener("change", () => rhint(t($("#rfGroup").checked ? "groupHint" : "roomHint")));
$("#editRoom").addEventListener("click", () => openRoom(roomOf(sel)));
$("#rfCancel").addEventListener("click", () => $("#rdlg").close());
$("#rf").addEventListener("submit", async e => {
  e.preventDefault();
  const members = [...document.querySelectorAll("#rfMembers input:checked")].map(i => i.value);
  if (!members.length) return rhint(t("pickMembers"), true);
  $("#rfGo").disabled = true;
  try {
    const j = await post("/api/rooms/save", {id: editing ? editing.id : undefined, name: $("#rfName").value, members,
      group: $("#rfGroup").checked});
    S.rooms = [...S.rooms.filter(r => r.id !== j.room.id), j.room];  // show it now, before the next poll
    $("#rdlg").close(); sel = `room:${j.room.id}`; $("#tl").dataset.first = "1"; render(true);
  } catch (err) { rhint(t("failed") + err.message, true); }
  finally { $("#rfGo").disabled = false; }
});
$("#rfDelete").addEventListener("click", async () => {
  if (!editing || !confirm(t("deleteAsk"))) return;
  try {
    await post("/api/rooms/delete", {id: editing.id});
    S.rooms = S.rooms.filter(r => r.id !== editing.id);
    $("#rdlg").close(); if (sel === `room:${editing.id}`) sel = null; render(true);
  } catch (err) { rhint(t("failed") + err.message, true); }
});

// ---- resizable split between the list and the chat; the width is saved like the other settings ----
const SIDE = {min: 180, max: 900, def: 260};
const sideMax = () => Math.max(SIDE.min, Math.min(SIDE.max, Math.floor(innerWidth * 0.6)));
function setSide(w) {
  w = Math.round(Math.max(SIDE.min, Math.min(sideMax(), w)));
  $("#side").style.width = w + "px";
  $("#split").setAttribute("aria-valuenow", w); $("#split").setAttribute("aria-valuemax", sideMax());
  return w;
}
let sideSaved = null, saveTimer = null;
function saveSide(w) {  // one save after the drag or the last key press
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (w !== pref("sideWidth")) setPref("sideWidth", w); }, 400);
}
function applySide() {  // the saved width, once known, unless the user is mid-drag
  const w = pref("sideWidth");
  if (typeof w === "number" && w !== sideSaved && !$("#split").classList.contains("drag")) { sideSaved = w; setSide(w); }
}
$("#split").addEventListener("pointerdown", e => {
  e.preventDefault();
  const sp = $("#split"), start = e.clientX, w0 = $("#side").getBoundingClientRect().width;
  sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); document.body.classList.add("resizing");
  const move = ev => setSide(w0 + ev.clientX - start);
  const up = () => {
    sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); sp.removeEventListener("pointercancel", up);
    sp.classList.remove("drag"); document.body.classList.remove("resizing");
    sideSaved = setSide($("#side").getBoundingClientRect().width); saveSide(sideSaved);
  };
  sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up); sp.addEventListener("pointercancel", up);
});
$("#split").addEventListener("keydown", e => {
  const w = $("#side").getBoundingClientRect().width, step = e.shiftKey ? 48 : 16;
  const to = {ArrowLeft: w - step, ArrowRight: w + step, Home: SIDE.min, End: sideMax()}[e.key];
  if (to === undefined) return;
  e.preventDefault(); sideSaved = setSide(to); saveSide(sideSaved);
});
$("#split").addEventListener("dblclick", () => { sideSaved = setSide(SIDE.def); saveSide(sideSaved); });
// Re-clamp the width the user chose, not the current one, so a narrow moment does not shrink it for good.
addEventListener("resize", () => setSide(typeof sideSaved === "number" ? sideSaved : SIDE.def));
setSide(SIDE.def);

applyLang(); render(); poll(); setInterval(poll, 3000);
</script>
