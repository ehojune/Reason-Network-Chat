<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="reason-chat-token" content="{{TOKEN}}">
<meta name="reason-chat-boot" content="{{BOOT}}">
<title>Reason Network Chat</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e4e3df; --text: #1f1f1d; --muted: #6f6e69;
  --accent: #c96442; --me: #f0e6dc; --bubble: #ffffff; --hover: #efeee9; --sel: #e8e2d8;
  --busy: #d97706; --idle: #16a34a; --off: #a3a3a3; --err: #b91c1c;
  --claude: #c96442; --codex: #2563eb; --agent: #7c3aed; --cli: #0f766e; --other: #6b7280;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d1d1b; --panel: #262624; --line: #3a3936; --text: #ecebe6; --muted: #a09f99;
  --me: #3b302a; --bubble: #2e2e2b; --hover: #31312e; --sel: #3a3631;
  --claude: #e08a68; --codex: #6ea0ff; --agent: #a78bfa; --cli: #2dd4bf; --err: #f87171;
} }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
/* Segoe UI before Malgun Gothic: Malgun Gothic draws "\" as a won sign, which wrecks Windows paths. */
body { background: var(--bg); color: var(--text); display: flex; overflow: hidden;
  font: 14px/1.5 "Pretendard", "Segoe UI", "Malgun Gothic", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
#side { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; }
/* Drag (or arrow keys) to resize the list; double-click to reset. A wide invisible grip over the border line. */
#split { flex: none; width: 8px; margin: 0 -4px; z-index: 2; cursor: col-resize; touch-action: none; position: relative; }
#split::after { content: ""; position: absolute; inset: 0 3px; background: transparent; transition: background .15s; }
#split:hover::after, #split:focus-visible::after, #split.drag::after { background: var(--accent); }
#split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
#brand { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 4px; }
#brand h1 { font-size: 15px; margin: 0; }
#langs button { background: none; color: var(--muted); border: none; padding: 0 3px; font-size: 11px; font-weight: 600; cursor: pointer; }
#langs button.on { color: var(--accent); }
#team { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
#acts { display: flex; gap: 6px; padding: 0 10px 10px; border-bottom: 1px solid var(--line); }
.act { flex: 1; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; cursor: pointer; }
.act:hover { background: var(--hover); }
#list { overflow-y: auto; flex: 1; padding: 6px; }
.grp { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 8px 4px; }
.ses { padding: 7px 8px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto;
  gap: 2px 8px; align-items: center; }
.ses:hover { background: var(--hover); }
.ses.sel { background: var(--sel); }
.ses.gone { opacity: .55; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.dot.busy { background: var(--busy); } .dot.idle { background: var(--idle); }
.nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnt { color: var(--muted); font-size: 11px; }
.sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 4px; color: #fff;
  background: var(--other); margin-right: 4px; vertical-align: 1px; }
.tag.claude-code { background: var(--claude); } .tag.codex { background: var(--codex); }
.tag.agent { background: var(--agent); } .tag.cli { background: var(--cli); }
.tag.wk { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.hash { color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1; text-align: center; }
.mem { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.mem label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; color: var(--text);
  font-size: 13px; cursor: pointer; }
.mem label:hover { background: var(--hover); }
.mem label.gone { opacity: .55; }
.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
.tag.grp { background: none; color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }
.relay { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 12px; margin: 6px 0; }
.relayHead { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.relayHead:hover { color: var(--text); }
.relay .bub { font-size: 13px; color: var(--text); background: var(--hover); border-style: dashed; margin-top: 3px;
  cursor: pointer; }
.relay.open .bub { cursor: auto; }
.relay:not(.open) .bub { max-height: 3.1em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); }
#paused { color: var(--err); }
#trouble { color: var(--err); font-size: 12px; }
#trouble[hidden] { display: none; }
#trouble button, .resendBtn { font: inherit; font-size: 12px; color: var(--accent); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; margin-left: 6px; cursor: pointer; }
.resendBtn { font-size: 11px; padding: 0 6px; }
.resendBtn:disabled { color: var(--muted); cursor: not-allowed; }
.trouble { color: var(--err); margin-left: 6px; }
.sysErr { align-self: center; max-width: min(720px, 90%); margin: 6px auto; padding: 4px 10px; font-size: 12px;
  color: var(--err); border: 1px solid var(--err); border-radius: 8px; text-align: center; }
.sysErr .errText { color: var(--muted); white-space: pre-wrap; word-break: break-word; text-align: left; margin-top: 2px; }
#paused button { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 8px; margin-left: 6px; cursor: pointer; }
#rcpt { font-size: 12px; color: var(--muted); min-height: 1em; }
#rcpt.none { color: var(--err); }
#dmHint { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 8px; margin: 2px 0; }
#dmHint[hidden] { display: none; }
.dmRoom, .fwdBtn { font: inherit; color: var(--accent); background: none; border: none; padding: 0; margin-left: 6px;
  cursor: pointer; text-decoration: underline; }
.fwdBtn { font-size: 11px; }
#ac { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
#ac button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 1px 8px; cursor: pointer; }
#ac button:first-child { border-color: var(--accent); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#head { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex;
  justify-content: space-between; align-items: center; gap: 8px; }
#head b { font-size: 15px; }
#headR { display: flex; align-items: center; gap: 10px; min-width: 0; }
#status { color: var(--muted); font-size: 12px; }
#status.err { color: var(--err); }
#stop, #editRoom, #wakeHead { font: inherit; font-size: 12px; color: var(--text); background: none; border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 8px; cursor: pointer; }
#stop, .danger { color: var(--err) !important; }
#members { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
#tl { flex: 1; overflow-y: auto; padding: 16px 18px; }
.day { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 8px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; margin: 10px 0; }
.msg.me { align-items: flex-end; }
.meta { font-size: 12px; color: var(--muted); margin: 0 4px 3px; }
.meta .who { font-weight: 600; color: var(--text); cursor: pointer; }
.meta .who:hover { text-decoration: underline; }
.bub { background: var(--bubble); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px;
  max-width: min(720px, 85%); white-space: pre-wrap; word-break: break-word; }
.msg.me .bub { background: var(--me); }
/* Markdown bubbles: rendered blocks, not pre-wrapped text (the raw view keeps pre-wrap) */
.bub.md { white-space: normal; min-width: 0; }
.bub.md p { margin: 0 0 6px; } .bub.md > :last-child { margin-bottom: 0; }
.bub.md .mh { font-weight: 700; margin: 8px 0 4px; } .bub.md .mh:first-child { margin-top: 0; }
.bub.md .mh1 { font-size: 1.15em; } .bub.md .mh2 { font-size: 1.08em; }
.bub.md ul, .bub.md ol { margin: 2px 0 6px; padding-left: 1.4em; }
.bub.md blockquote { border-left: 3px solid var(--line); margin: 4px 0 6px; padding-left: 8px; color: var(--muted); }
.bub.md hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
.bub.md a { color: var(--accent); }
.bub code { font-family: ui-monospace, Consolas, "D2Coding", monospace; font-size: 12.5px; background: var(--hover);
  padding: 0 4px; border-radius: 4px; }
.bub.md pre { background: var(--hover); padding: 8px 10px; border-radius: 8px; overflow-x: auto; margin: 4px 0 6px;
  white-space: pre; }
.bub.md pre code { background: none; padding: 0; }
.bub.md .tbl { overflow-x: auto; max-width: 100%; margin: 4px 0 6px; }
.bub.md table { border-collapse: collapse; font-size: 13px; }
.bub.md th, .bub.md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top;
  min-width: 3em; max-width: 32em; }
.bub.md th { background: var(--hover); font-weight: 600; }
.bub.md .al-c { text-align: center; } .bub.md .al-r { text-align: right; }
.rawBtn { font: inherit; font-size: 11px; color: var(--muted); background: none; border: none; padding: 0; margin-left: 6px;
  cursor: pointer; text-decoration: underline dotted; }
.tag.me { background: var(--accent); }
.quote { border-left: 3px solid var(--line); color: var(--muted); font-size: 12px; padding: 0 0 0 8px; margin-bottom: 6px;
  max-height: 3em; overflow: hidden; }
.foot { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
.replyBtn { font: inherit; font-size: 12px; color: var(--muted); background: none; border: none; padding: 0 4px;
  margin-left: 4px; cursor: pointer; visibility: hidden; }
.msg:hover .replyBtn, .replyBtn:focus-visible { visibility: visible; }
.replyBtn:hover { color: var(--accent); }
#replyChip { font-size: 12px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 8px; margin: 2px 0;
  display: flex; gap: 6px; align-items: center; }
#replyChip[hidden] { display: none; }
#replyText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#replyX { font: inherit; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0 4px; }
.empty { color: var(--muted); text-align: center; margin-top: 30vh; }
#comp { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
#nowake { font-size: 12px; color: var(--muted); }
#offToggle { font: inherit; font-size: 11.5px; color: var(--muted); background: none; border: none; padding: 8px 8px 4px;
  cursor: pointer; text-align: left; }
#offToggle:hover { color: var(--text); text-decoration: underline; }
#restartAll { font: inherit; font-size: 11.5px; color: var(--accent); background: none; border: none; padding: 4px 8px;
  cursor: pointer; text-align: left; }
#restartAll:hover { text-decoration: underline; }
.ses:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.star { color: var(--accent); margin-right: 4px; }
#ctx { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); padding: 4px; min-width: 150px; }
#ctx button { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text);
  background: none; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
#ctx button:hover, #ctx button:focus-visible { background: var(--hover); outline: none; }
#ctx button[hidden] { display: none; }
#nowake #wakeNote { font-style: italic; }
#nowake button { font: inherit; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline; }
#row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
select, textarea, input, #btn { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
select { padding: 4px 6px; max-width: 320px; }
#inrow { display: flex; gap: 8px; }
textarea { flex: 1; resize: none; padding: 8px 10px; min-height: 42px; max-height: 160px; }
#btn, .go { background: var(--accent); color: #fff; border: none; padding: 0 16px; cursor: pointer; font-weight: 600; }
#btn:disabled, .go:disabled { opacity: .5; cursor: default; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
  padding: 18px 20px; width: min(560px, 94vw); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.stuck { color: var(--err); font-weight: 600; }
#pdlg ul { list-style: none; padding: 0; margin: 8px 0; max-height: 50vh; overflow: auto; font-size: 12px; }
#pdlg li { padding: 3px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
#pdlg li b { font-family: ui-monospace, Consolas, monospace; }
#pdlgNote { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
dialog h2 { font-size: 16px; margin: 0 0 4px; }
.fld { display: flex; flex-direction: column; gap: 4px; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.fld input, .fld select { font-size: 14px; padding: 6px 8px; max-width: none; }
.fld select:disabled, .fld input:disabled { opacity: .55; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--me); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.chip.fa.on { border-color: var(--err); color: var(--err); }
.tag.fa { background: var(--err); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12px; color: var(--muted); min-height: 1.5em; margin: 12px 0 0; white-space: pre-wrap; }
.hint.err { color: var(--err); }
.dbtn { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.dbtn button { font: inherit; font-size: 13px; border-radius: 8px; padding: 6px 14px; }
.plain { color: var(--text); background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
@media (max-width: 640px) { #side { width: 170px !important; } #split { display: none; } .sub { display: none; }
  .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside id="side">
  <div id="brand"><h1>Reason Network Chat</h1><span id="langs"></span></div>
  <div id="team"></div>
  <div id="acts"><button type="button" class="act" id="newSes" data-t="newSession"></button>
    <button type="button" class="act" id="newRoom" data-t="newRoom"></button></div>
  <div id="list"></div>
</aside>
<div id="split" role="separator" aria-orientation="vertical" tabindex="0" aria-valuemin="180"></div>
<main>
  <div id="head"><span><b id="title"></b><span id="members"></span></span><span id="headR">
    <button type="button" id="wakeHead" hidden data-t="wake"></button>
    <button type="button" id="editRoom" hidden data-t="editRoom"></button>
    <button type="button" id="stop" hidden data-t="stop"></button><span id="status"></span></span></div>
  <div id="tl"></div>
  <form id="comp">
    <div id="paused"></div>
    <div id="trouble" hidden></div>
    <div id="nowake" hidden><span id="nowakeText"></span> <button type="button" id="wakeBtn" data-t="wake"></button>
      <button type="button" id="toWorker" data-t="toWorker"></button> <span id="wakeNote"></span></div>
    <div id="row">
      <span data-t="to"></span><select id="to"></select>
      <label id="fyiLabel"><input type="checkbox" id="fyi"> <span data-t="fyi"></span></label>
      <label id="wakeAfterLabel" hidden><input type="checkbox" id="wakeAfter"> <span data-t="wakeAfter"></span></label>
      <span id="sendmsg"></span>
    </div>
    <div id="replyChip" hidden><span id="replyText"></span><button type="button" id="replyX">×</button></div>
    <div id="dmHint" hidden><span id="dmHintText"></span><span id="dmRooms"></span></div>
    <div id="rcpt" hidden></div>
    <div id="ac" hidden></div>
    <div id="inrow">
      <textarea id="body"></textarea>
      <button id="btn" type="submit" data-t="send"></button>
    </div>
  </form>
</main>
<div id="ctx" role="menu" hidden><button type="button" role="menuitem" id="ctxFav"></button><button type="button" role="menuitem" id="ctxAuto" hidden></button><button type="button" role="menuitem" id="ctxConf" hidden></button><button type="button" role="menuitem" id="ctxAdopt" hidden></button><button type="button" role="menuitem" id="ctxRestart" hidden></button><button type="button" role="menuitem" id="ctxProcs" hidden></button></div>
<dialog id="pdlg"><h2 id="pdlgTitle"></h2><div id="pdlgNote"></div><ul id="pdlgList"></ul>
  <div class="dbtn"><button type="button" class="plain" id="pdlgClose"></button><button type="button" class="go" id="pdlgRestart"></button></div></dialog>
<dialog id="dlg">
  <form id="lf">
    <h2 id="lfTitle" data-t="newSessionTitle"></h2>
    <label class="fld"><span data-t="folder"></span>
      <input id="lfFolder" list="folders" required spellcheck="false" autocomplete="off"></label>
    <datalist id="folders"></datalist>
    <div class="fld"><span data-t="agent"></span><div class="chips" id="lfAgents"></div></div>
    <div class="fld"><span data-t="runAs"></span><div class="chips" id="lfModes"></div></div>
    <div class="two">
      <label class="fld"><span data-t="model"></span><select id="lfModel"></select></label>
      <label class="fld"><span data-t="effort"></span><select id="lfEffort"></select></label>
    </div>
    <div class="fld"><span data-t="perm"></span><div class="chips" id="lfPerms"></div></div>
    <p class="hint" id="lfPermHint"></p>
    <label class="fld" id="lfNameRow"><span data-t="name"></span>
      <input id="lfName" spellcheck="false" autocomplete="off" maxlength="48"></label>
    <p class="hint" id="lfHint"></p>
    <div class="dbtn"><button type="button" class="plain" id="lfCancel" data-t="cancel"></button>
      <button type="submit" class="go" id="lfGo" data-t="start"></button></div>
  </form>
</dialog>
<dialog id="rdlg">
  <form id="rf">
    <h2 id="rfTitle"></h2>
    <label class="fld"><span data-t="roomName"></span>
      <input id="rfName" required maxlength="60" autocomplete="off"></label>
    <div class="fld"><span data-t="roomMembers"></span><div class="mem" id="rfMembers"></div></div>
    <label class="fld chk"><input type="checkbox" id="rfGroup"> <span data-t="groupChat"></span></label>
    <div id="rfGroupOpts" hidden>
      <label class="fld"><span data-t="defaultTo"></span><select id="rfDefault"></select></label>
      <div class="fld"><span data-t="allowPost"></span><div class="mem" id="rfPost"></div>
        <span class="hint" data-t="allowPostHint"></span></div>
      <div class="two">
        <div class="fld"><span data-t="hopsLimit"></span><input type="number" id="rfHops" min="1" max="100000">
          <label class="chk"><input type="checkbox" id="rfHopsOff"> <span data-t="noLimit"></span></label></div>
        <div class="fld"><span id="rfBudgetLabel"></span><input type="number" id="rfBudget" min="1" max="100000">
          <label class="chk"><input type="checkbox" id="rfBudgetOff"> <span data-t="noLimit"></span></label></div>
      </div>
    </div>
    <p class="hint" id="rfHint"></p>
    <div class="dbtn"><button type="button" class="plain danger" id="rfDelete" data-t="deleteRoom"></button>
      <span style="flex:1"></span>
      <button type="button" class="plain" id="rfCancel" data-t="cancel"></button>
      <button type="submit" class="go" id="rfGo" data-t="save"></button></div>
  </form>
</dialog>
<script>
const T = {
  ko: { all: "전체 대화", connecting: "연결 중…", loading: "불러오는 중…", empty: "메시지가 없습니다",
    raw: "원문", formatted: "서식", reply: "답글", replyX: "답글 취소",
    dmHint: "이 대화는 1:1입니다. 답에 쓴 @는 방으로 넘어가지 않습니다. 여러 멤버에게 알릴 일은 방에서 보내세요.",

const LOCALE = {ko: "ko-KR", en: "en-US", zh: "zh-CN"};
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }};
const guess = () => { const l = (navigator.language || "en").toLowerCase(); return l.startsWith("ko") ? "ko" : l.startsWith("zh") ? "zh" : "en"; };
let lang = new URLSearchParams(location.search).get("lang") || store.get("reason-chat-lang") || guess();
if (!T[lang]) lang = "en";
const t = k => T[lang][k];
const TOKEN = document.querySelector('meta[name="reason-chat-token"]').content;
const API = 16;  // must match API in server.py
const BOOT = document.querySelector('meta[name="reason-chat-boot"]').content;  // which server start served this page
// Reload to pick up a restarted or newer server, at most once a minute so a broken setup cannot loop.
function reloadOnce() {
  let last = 0;
  try { last = +sessionStorage.getItem("rnc-reloaded") || 0; } catch {}
  if (Date.now() - last < 60000) return false;
  try { sessionStorage.setItem("rnc-reloaded", String(Date.now())); } catch {}
  location.reload();
  return true;
}

const $ = s => document.querySelector(s);
let S = null, sel = null, lastSig = "", pendingAddr = null;
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = a => (a || "").replace(/^[^/]+\//, "");
const fmtT = ms => new Date(ms).toLocaleTimeString(LOCALE[lang], {hour: "2-digit", minute: "2-digit"});
const fmtD = ms => new Date(ms).toLocaleDateString(LOCALE[lang], {year: "numeric", month: "long", day: "numeric", weekday: "short"});
const st = s => t(s) || s;

async function post(url, obj) {
  const r = await fetch(url, {method: "POST", body: JSON.stringify(obj),
    headers: {"Content-Type": "application/json", "X-Reason-Chat-Token": TOKEN}});
  const j = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
  // The server restarted (new token) whatever its version: a fresh page from it carries the right token.
  if (r.status === 403 && /token/.test(j.error || "")) reloadOnce();
  if (!r.ok || j.error || j.ok === false) {
    throw Object.assign(new Error(j.error || j.err || j.out || `HTTP ${r.status}`), {status: r.status});
  }
  return j;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  $("#body").placeholder = t("ph");
  $("#fyiLabel").title = t("fyiTip");
  $("#split").title = t("split"); $("#split").setAttribute("aria-label", t("split"));
  $("#langs").innerHTML = [["ko", "KO"], ["en", "EN"], ["zh", "中"]]
    .map(([k, l]) => `<button type="button" data-l="${k}" class="${k === lang ? "on" : ""}">${l}</button>`).join("");
  if (!S) { $("#team").textContent = t("connecting"); $("#tl").innerHTML = `<div class="empty">${t("loading")}</div>`; }
  if (CAT && $("#dlg").open) renderLaunch();
}

// Live session type wins: replies from `serve` workers are recorded with sender_agent "cli".
function agentOf(addr, recorded) {
  if (addr === S.me) return t("me");
  const s = S.sessions.find(x => x.address === addr);
  if (s && s.agent && s.agent !== "?") return s.agent;
  return recorded || S.messages.find(x => x.sender === addr && x.sender_agent)?.sender_agent || "?";
}
// The agent badge in front of a session name; the page's own address shows as "me".
function agentTag(addr, recorded, quiet) {
  const ag = agentOf(addr, recorded);
  if (quiet && ag === "?") return "";
  return `<span class="tag ${addr === S.me ? "me" : esc(ag)}">${esc(ag)}</span>`;
}
const person = () => (S && S.me ? S.me.split("/")[0] : "");
// The selection is "" (everything), a session address, or "room:<id>".
const roomOf = key => key && key.startsWith("room:") && S ? (S.rooms || []).find(r => r.id === key.slice(5)) : null;
function inRoom(m, room) {
  const ms = room.members, ok = a => a === S.me || ms.includes(a);

// ---- rooms: a saved set of sessions; this page filters to their traffic and sends to all of them ----
let editing = null;
function rhint(msg, err) { $("#rfHint").className = "hint" + (err ? " err" : ""); $("#rfHint").textContent = msg || ""; }
function openRoom(room) {

  $("#rfName").value = room ? room.name : "";

  const chosen = new Set(room ? room.members : sel && !sel.startsWith("room:") ? [sel] : []);
  const up = s => s.live && s.status !== "offline";
  // Saved members whose traffic fell out of the message window are not in S.sessions; list them anyway,
  // or saving (even a rename) would drop them.
  const extra = [...chosen].filter(a => !S.sessions.some(s => s.address === a))
    .map(a => ({address: a, name: short(a), agent: "?", live: false, status: "gone"}));
  const ss = S.sessions.filter(s => s.address !== S.me).concat(extra)
    .sort((a, b) => (chosen.has(b.address) - chosen.has(a.address)) || (up(b) - up(a)) || a.name.localeCompare(b.name));
  $("#rfMembers").innerHTML = ss.map(s => `<label class="${up(s) ? "" : "gone"}"><input type="checkbox" value="${esc(s.address)}"
    ${chosen.has(s.address) ? "checked" : ""}><span class="tag ${esc(s.agent)}">${esc(s.agent)}</span>${esc(s.name)}</label>`).join("");
  const lim = (room && room.limits) || {}, d = S.relayDefaults;
  for (const [key, id] of [["hops", "rfHops"], ["budget", "rfBudget"]]) {
    $(`#${id}`).placeholder = d[key];

    $(`#${id}`).disabled = $(`#${id}Off`).checked;
  }

// The default recipient is picked from the members ticked right now.

  const members = [...document.querySelectorAll("#rfMembers input:checked")].map(i => i.value);
  const on = keepPost || [...document.querySelectorAll("#rfPost input:checked")].map(i => i.value);

$("#rf").addEventListener("submit", async e => {

  // Limits: empty = the default, "no limit" = null (asked once, since agents can then answer each other forever).
  const limits = {}, was = (editing && editing.limits) || {};
  for (const [key, id] of [["hops", "rfHops"], ["budget", "rfBudget"]]) {

  $("#rfGo").disabled = true;

      group: $("#rfGroup").checked, limits, defaultTo: $("#rfDefault").value || null,
      allowPost: [...document.querySelectorAll("#rfPost input:checked")].map(i => i.value)});

  if (!editing || !confirm(t("deleteAsk"))) return;
  try {
    await post("/api/rooms/delete", {id: editing.id});
    S.rooms = S.rooms.filter(r => r.id !== editing.id);
    $("#rdlg").close(); if (sel === `room:${editing.id}`) sel = null; render(true);
  } catch (err) { rhint(t("failed") + err.message, true); }
});

// ---- resizable split between the list and the chat; the width is saved like the other settings ----
const SIDE = {min: 180, max: 900, def: 260};
const sideMax = () => Math.max(SIDE.min, Math.min(SIDE.max, Math.floor(innerWidth * 0.6)));
function setSide(w) {
  w = Math.round(Math.max(SIDE.min, Math.min(sideMax(), w)));
  $("#side").style.width = w + "px";
  $("#split").setAttribute("aria-valuenow", w); $("#split").setAttribute("aria-valuemax", sideMax());
  return w;
}
let sideSaved = null, saveTimer = null;
function saveSide(w) {  // one save after the drag or the last key press
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (w !== pref("sideWidth")) setPref("sideWidth", w); }, 400);
}
function applySide() {  // the saved width, once known, unless the user is mid-drag
  const w = pref("sideWidth");
  if (typeof w === "number" && w !== sideSaved && !$("#split").classList.contains("drag")) { sideSaved = w; setSide(w); }
}
$("#split").addEventListener("pointerdown", e => {
  e.preventDefault();
  const sp = $("#split"), start = e.clientX, w0 = $("#side").getBoundingClientRect().width;
  sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); document.body.classList.add("resizing");
  const move = ev => setSide(w0 + ev.clientX - start);
  const up = () => {
    sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); sp.removeEventListener("pointercancel", up);
    sp.classList.remove("drag"); document.body.classList.remove("resizing");
    sideSaved = setSide($("#side").getBoundingClientRect().width); saveSide(sideSaved);
  };
  sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up); sp.addEventListener("pointercancel", up);
});
$("#split").addEventListener("keydown", e => {
  const w = $("#side").getBoundingClientRect().width, step = e.shiftKey ? 48 : 16;
  const to = {ArrowLeft: w - step, ArrowRight: w + step, Home: SIDE.min, End: sideMax()}[e.key];
  if (to === undefined) return;
  e.preventDefault(); sideSaved = setSide(to); saveSide(sideSaved);
});
$("#split").addEventListener("dblclick", () => { sideSaved = setSide(SIDE.def); saveSide(sideSaved); });
// Re-clamp the width the user chose, not the current one, so a narrow moment does not shrink it for good.
addEventListener("resize", () => setSide(typeof sideSaved === "number" ? sideSaved : SIDE.def));
setSide(SIDE.def);

applyLang(); render(); poll(); setInterval(poll, 3000);
</script>
